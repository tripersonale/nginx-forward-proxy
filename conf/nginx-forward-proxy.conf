# nginx forward proxy configuration
# Richiede ngx_http_proxy_connect_module (compilato da sorgente)
# Testato su Ubuntu 26.04 LTS con nginx 1.26.3
#
# USO: copia questo file direttamente in /usr/local/nginx/conf/nginx.conf
#      oppure installalo via deploy.sh
#      NON fare cat in un heredoc shell (i $ verrebbero espansi)

user  nobody nogroup;
worker_processes  auto;
error_log  /var/log/nginx/proxy_error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ==================== LOG FORMAT ====================
    # $upstream_addr  → IP:porta RISOLTA del server destinazione (HTTP)
    # $connect_addr   → IP:porta RISOLTA per CONNECT (HTTPS)
    # $http_host      → hostname richiesto dal client
    # $upstream_connect_time → latenza DNS+TCP
    log_format forward_proxy '$remote_addr $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'host="$http_host" '
                             'upstream="$upstream_addr" '
                             'connect_addr="$connect_addr" '
                             'method="$request_method" '
                             'proto="$server_protocol" '
                             'rt=$request_time '
                             'uct=$upstream_connect_time '
                             'uht=$upstream_header_time';

    access_log  /var/log/nginx/proxy_access.log  forward_proxy buffer=32k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # DNS resolver (IPv4 only to avoid IPv6 unreachable errors)
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 10s;

    server {
        listen 3128;
        server_name _;

        # Limit access to trusted subnet
        allow 192.168.89.0/24;
        deny all;

        # CONNECT method support for HTTPS proxying
        proxy_connect;
        proxy_connect_allow            443 563;
        proxy_connect_connect_timeout  30s;
        proxy_connect_read_timeout     60s;
        proxy_connect_send_timeout     60s;

        # HTTP forward proxy
        location / {
            proxy_pass $scheme://$http_host$request_uri;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_ssl_server_name on;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
